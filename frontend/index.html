<!DOCTYPE html>
<html lang="zh-CN" data-theme="forest" data-mode="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Selenyx 科研工作台 — 本地优先、证据门闭环、八段科研流水线（AI 干活，人签字）" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/brand-crane-cloud-512-v1.png" />
    <title>Selenyx 科研工作台</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('selenyx-v2');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var state = parsed && parsed.state ? parsed.state : null;
          if (!state) return;
          var root = document.documentElement;
          if (state.theme) root.dataset.theme = String(state.theme);
          if (state.mode === 'dark' || state.mode === 'light') root.dataset.mode = state.mode;
          if (state.density) root.dataset.density = String(state.density);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
