<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selenyx 仙鹤</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body { display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
  .pet { width: 124px; height: 124px; display: grid; place-items: center; transition: transform 120ms ease; cursor: pointer; }
  .pet.flip { transform: scaleX(-1); }
  /* 白羽在任何底色上都要可辨：墨影勾边 + 落地淡影 */
  .crane {
    width: 116px; height: auto; display: block;
    filter:
      drop-shadow(0 0 1.5px rgba(27, 27, 27, 0.45))
      drop-shadow(0 3px 6px rgba(27, 27, 27, 0.22));
    animation: perch-breathe 2.8s ease-in-out infinite;
    transform-origin: 50% 88%;
  }
  /* 趴着：缓慢呼吸起伏；飞行：振翅频率加快并前倾 */
  .pet.flying .crane { animation: fly-flap 560ms ease-in-out infinite; }
  .pet.idle .crane { animation-play-state: running; }
  @keyframes perch-breathe {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-1.6px) rotate(-0.8deg); }
  }
  @keyframes fly-flap {
    0%, 100% { transform: translateY(0) rotate(-4deg) scaleY(1); }
    50% { transform: translateY(-4px) rotate(3deg) scaleY(0.94); }
  }
  @media (prefers-reduced-motion: reduce) {
    .crane { animation: none !important; }
  }
</style>
</head>
<body>
<div class="pet idle" id="pet" title="仙鹤伙伴：点我飞一圈，右键收起">
  <img class="crane" src="crane.png" alt="" draggable="false" />
</div>
<script>
  // 位移由 Rust 侧定时器驱动（pet.rs）；此处根据窗口实际移动速度切换飞/趴姿态。
  const pet = document.getElementById('pet');
  let lastX = window.screenX, lastY = window.screenY;
  setInterval(() => {
    const dx = window.screenX - lastX;
    const dy = window.screenY - lastY;
    lastX = window.screenX; lastY = window.screenY;
    const speed = Math.abs(dx) + Math.abs(dy);
    if (Math.abs(dx) > 0.5) pet.classList.toggle('flip', dx < 0);
    pet.classList.toggle('flying', speed > 3.2);
    pet.classList.toggle('idle', speed < 0.4);
  }, 90);

  // 点击飞一圈；右键收起桌宠（仅发事件，窗口动作全在 Rust 侧）
  const emit = (name) => {
    try { window.__TAURI__?.event?.emit(name); } catch (_) { /* 无权限时静默 */ }
  };
  pet.addEventListener('click', () => emit('pet:clicked'));
  pet.addEventListener('contextmenu', (event) => {
    event.preventDefault();
    emit('pet:hide');
  });
</script>
</body>
</html>
