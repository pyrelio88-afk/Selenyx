<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selenyx 仙鹤</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body { display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
  .pet { width: 108px; height: 108px; display: grid; place-items: center; transition: transform 120ms ease; }
  .pet.flip { transform: scaleX(-1); }
  .crane { color: #1b1b1b; filter: drop-shadow(0 0 2.5px rgba(255,255,255,.9)) drop-shadow(0 1px 1px rgba(255,255,255,.5)); }
  .wing { transform-origin: 33px 33px; animation: flap-walk 1.6s ease-in-out infinite; }
  .body-group { animation: bob-walk 1.6s ease-in-out infinite; }
  .legs { transition: opacity 200ms ease; }
  /* 飞行：快速扑翼 + 轻盈起伏 + 收腿 */
  .pet.flying .wing { animation: flap-fly 380ms ease-in-out infinite; }
  .pet.flying .body-group { animation: bob-fly 760ms ease-in-out infinite; }
  .pet.flying .legs { opacity: 0; }
  .pet.idle .wing { animation: none; }
  .pet.idle .body-group { animation: none; }
  @keyframes flap-walk { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
  @keyframes bob-walk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
  @keyframes flap-fly { 0%,100% { transform: rotate(7deg); } 50% { transform: rotate(-13deg); } }
  @keyframes bob-fly { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) {
    .wing, .body-group { animation: none !important; }
  }
</style>
</head>
<body>
<div class="pet idle" id="pet">
  <svg class="crane" viewBox="0 0 64 64" width="96" height="96" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <g class="body-group">
      <!-- 展开的翅膀（扑翼动画组） -->
      <g class="wing">
        <path d="M33 33 C37 24 45 14 56 8 C50 17 45 26 43 35" />
        <path d="M35 34 C41 28 50 22 59 19" />
        <path d="M36 36 C43 32 51 29 58 28" opacity="0.7" />
      </g>
      <!-- 身体 -->
      <path d="M27 38 C25 43 30 47 38 47 C47 47 52 43 51 38 C50 33 44 31 38 32 C32 33 28 35 27 38 Z" />
      <!-- S 形长颈 -->
      <path d="M29 37 C24 33 20 27 19 21 C18 16 20 13 23 12" />
      <path d="M31 37 C27 33 24 28 23 22" opacity="0.55" />
      <!-- 头部与喙 -->
      <path d="M23 12 C24 11 26 11 27 12 L16 15 C18 12 20 11 23 12 Z" />
      <!-- 丹顶（朱砂） -->
      <circle cx="23" cy="10.6" r="2" fill="#c7483b" stroke="none" />
      <!-- 尾羽 -->
      <path d="M51 41 C55 43 57 46 58 49" />
      <path d="M50 44 C53 46 55 48 56 51" opacity="0.7" />
      <!-- 细腿（飞行时收起） -->
      <g class="legs">
        <path d="M35 47 L34 58" />
        <path d="M43 47 L45 58" opacity="0.8" />
      </g>
    </g>
  </svg>
</div>
<script>
  // 位移由 Rust 侧定时器驱动；此处根据窗口实际移动方向/速度切换朝向与步态。
  const pet = document.getElementById('pet');
  let lastX = window.screenX, lastY = window.screenY;
  setInterval(() => {
    const dx = window.screenX - lastX;
    const dy = window.screenY - lastY;
    lastX = window.screenX; lastY = window.screenY;
    const speed = Math.abs(dx) + Math.abs(dy);
    if (Math.abs(dx) > 0.5) pet.classList.toggle('flip', dx < 0);
    pet.classList.toggle('flying', speed > 3.2);
    pet.classList.toggle('idle', speed < 0.4);
  }, 90);
</script>
</body>
</html>
