name: Verify Selenyx

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-local-first-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.x"
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run typecheck
          npm test -- --run
          npm run lint
          npm run build

      - name: Verify local backend
        run: |
          uv sync --project backend --extra dev --extra package --locked
          uv run --project backend --extra dev python -m pytest backend/tests -q

      - name: Verify desktop source and sidecar contract
        run: |
          npm run desktop:doctor
          npm run backend:bundle
          cargo fmt --check --manifest-path desktop/Cargo.toml
          cargo check --manifest-path desktop/Cargo.toml --locked
          cargo test --manifest-path desktop/Cargo.toml --locked
