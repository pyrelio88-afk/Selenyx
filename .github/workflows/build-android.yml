name: Build Android APK

# 产出 Android APK：cargo tauri android build --apk
# 在 ubuntu runner 上装好 JDK17 + Android SDK + NDK + Rust android targets，再 init + build。
# 产物：arm64-v8a / armeabi-v7a APK 上传为 artifact。
#
# 触发：手动（workflow_dispatch）或随发版标签。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Init Android project
        run: cargo tauri android init
        working-directory: desktop

      - name: Build APK
        run: cargo tauri android build --apk --split-per-abi
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selenyx-android-apk
          path: |
            desktop/gen/android/app/build/outputs/apk/**/*.apk
