<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Selenyx research workbench architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f7f4"/>
      <stop offset="100%" stop-color="#efeae4"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#352f2a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="56" y="58" fill="#b4382f" font-family="Georgia, serif" font-size="14" letter-spacing="3">SELENYX R0.8</text>
  <text x="56" y="98" fill="#252321" font-family="Georgia, serif" font-size="36">Research Workbench</text>
  <text x="56" y="128" fill="#6f6a64" font-family="Segoe UI, sans-serif" font-size="16">证据优先 · 本地优先 · 内置浏览器 + 真实 API 检索 + 阅读批注闭环</text>

  <!-- Left nav -->
  <g filter="url(#soft)">
    <rect x="56" y="170" width="220" height="470" rx="14" fill="#ffffff" stroke="#dfdbd5"/>
  </g>
  <text x="78" y="210" fill="#b4382f" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">LEFT · 导航</text>
  <text x="78" y="250" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">文献检索</text>
  <text x="78" y="285" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">本地文献库</text>
  <text x="78" y="320" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">阅读 / 批注</text>
  <text x="78" y="355" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">科研浏览器</text>
  <text x="78" y="390" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">证据链</text>
  <text x="78" y="425" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">Nature 助手</text>
  <text x="78" y="480" fill="#99928b" font-family="Segoe UI, sans-serif" font-size="12">项目自动保存</text>
  <text x="78" y="505" fill="#99928b" font-family="Segoe UI, sans-serif" font-size="12">workspace.json</text>

  <!-- Center -->
  <g filter="url(#soft)">
    <rect x="300" y="170" width="560" height="470" rx="14" fill="#ffffff" stroke="#dfdbd5"/>
  </g>
  <text x="328" y="210" fill="#b4382f" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">CENTER · 工作面</text>
  <rect x="328" y="230" width="504" height="84" rx="10" fill="#f8e9e6" stroke="#dfdbd5"/>
  <text x="348" y="265" fill="#252321" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">真实文献检索</text>
  <text x="348" y="290" fill="#6f6a64" font-family="Segoe UI, sans-serif" font-size="13">OpenAlex / PubMed / Crossref … + 中国站点跳转</text>

  <rect x="328" y="330" width="244" height="120" rx="10" fill="#f8f7f4" stroke="#dfdbd5"/>
  <text x="348" y="365" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">内置浏览器</text>
  <text x="348" y="392" fill="#6f6a64" font-family="Segoe UI, sans-serif" font-size="13">WebContentsView</text>
  <text x="348" y="418" fill="#6f6a64" font-family="Segoe UI, sans-serif" font-size="13">失败 → 系统浏览器兜底</text>

  <rect x="584" y="330" width="248" height="120" rx="10" fill="#f8f7f4" stroke="#dfdbd5"/>
  <text x="604" y="365" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">阅读器</text>
  <text x="604" y="392" fill="#6f6a64" font-family="Segoe UI, sans-serif" font-size="13">摘要可选中批注</text>
  <text x="604" y="418" fill="#6f6a64" font-family="Segoe UI, sans-serif" font-size="13">L1 翻译 / 总结 / 证据</text>

  <rect x="328" y="470" width="504" height="130" rx="10" fill="#252321"/>
  <text x="348" y="510" fill="#f8e9e6" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">证据闭环</text>
  <text x="348" y="540" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15">问题 → 真实来源 → 收藏 → 批注 → 主张-证据-置信度</text>
  <text x="348" y="568" fill="#cec8c0" font-family="Segoe UI, sans-serif" font-size="13">无 Key 不伪装模型输出 · 0 结果如实显示</text>

  <!-- Right -->
  <g filter="url(#soft)">
    <rect x="884" y="170" width="260" height="470" rx="14" fill="#ffffff" stroke="#dfdbd5"/>
  </g>
  <text x="908" y="210" fill="#b4382f" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">RIGHT · 上下文</text>
  <text x="908" y="250" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">检索摘要</text>
  <text x="908" y="285" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">快速打开结果</text>
  <text x="908" y="320" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">批注列表</text>
  <text x="908" y="355" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">证据审阅状态</text>
  <text x="908" y="390" fill="#252321" font-family="Segoe UI, sans-serif" font-size="15">研究路径进度</text>
  <text x="908" y="450" fill="#99928b" font-family="Segoe UI, sans-serif" font-size="12">L1 离线可用</text>
  <text x="908" y="475" fill="#99928b" font-family="Segoe UI, sans-serif" font-size="12">L2 需 BYOK</text>
  <text x="908" y="520" fill="#3f7457" font-family="Segoe UI, sans-serif" font-size="13">Keys 仅主进程安全存储</text>
</svg>
