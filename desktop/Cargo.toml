[package]
name = "selenyx-desktop"
version = "0.0.1"
description = "Selenyx 科研工作台桌面端 Tauri v2"
edition = "2021"
rust-version = "1.77"

[lib]
name = "selenyx_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["desktop"]
desktop = []
mobile = []

# Android 构建用 mobile feature：cargo tauri android build 自动启用
# 桌面构建用 default (desktop) feature
