<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B3D"/>
      <stop offset="55%" stop-color="#0A0E1F"/>
      <stop offset="100%" stop-color="#0E1330"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#FFF9E8"/>
      <stop offset="48%" stop-color="#F0E6C9"/>
      <stop offset="100%" stop-color="#C9BD9B"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C9EFF" stop-opacity=".45"/>
      <stop offset="70%" stop-color="#7C9EFF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#7C9EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#night)"/>
  <rect x="8" y="8" width="496" height="496" rx="118" fill="none" stroke="#2A3563" stroke-width="3"/>
  <!-- 星点 -->
  <g fill="#8B96B8">
    <circle cx="120" cy="128" r="4" opacity=".8"/>
    <circle cx="392" cy="112" r="3" opacity=".55"/>
    <circle cx="418" cy="330" r="3.5" opacity=".6"/>
    <circle cx="98" cy="356" r="2.5" opacity=".45"/>
    <circle cx="352" cy="412" r="3" opacity=".5"/>
    <path d="M404 196l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#7C9EFF" opacity=".95"/>
    <path d="M112 236l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#7C9EFF" opacity=".6"/>
  </g>
  <!-- 月晕 -->
  <circle cx="256" cy="262" r="168" fill="url(#halo)"/>
  <!-- 月亮 -->
  <circle cx="256" cy="262" r="128" fill="url(#moon)"/>
  <g fill="#C4B58E">
    <circle cx="216" cy="222" r="20" opacity=".55"/>
    <circle cx="292" cy="288" r="14" opacity=".5"/>
    <circle cx="232" cy="312" r="10" opacity=".45"/>
    <circle cx="300" cy="216" r="8" opacity=".4"/>
  </g>
  <!-- 月牙高光环 -->
  <path d="M150 218a128 128 0 0 1 74-102" fill="none" stroke="#FFFDF4" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- 学术笔触：月下的文献横线 -->
  <g stroke="#7C9EFF" stroke-width="10" stroke-linecap="round" opacity=".9">
    <line x1="176" y1="428" x2="336" y2="428"/>
    <line x1="206" y1="452" x2="306" y2="452" opacity=".55"/>
  </g>
